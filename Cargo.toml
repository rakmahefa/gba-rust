[workspace]
resolver = "2"
members = [
    "crates/gba-runtime",
    "crates/gba-recompiler",
    "crates/gba-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
